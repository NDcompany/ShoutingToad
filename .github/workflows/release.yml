name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        # The Intel macOS build is cross-compiled on an Apple Silicon runner, so it isn't run here.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/shouting-toad
          "$bin" --version
          "$bin" crawl https://example.com --max-urls 5 --out smoke --quiet
          test -s smoke/report.html && test -s smoke/issues.csv

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name=shouting-toad-${{ matrix.target }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/shouting-toad "$name/"
          cp README.md LICENSE installer/install_linux.sh installer/uninstall_linux.sh installer/shouting-toad.desktop assets/icon_256.png "$name/"
          # Flat archive: extracting it puts ./shouting-toad in the current folder
          # (the generated CI workflow relies on this).
          tar -czf "$name.tar.gz" -C "$name" .
          echo "ASSETS=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          name=shouting-toad-${{ matrix.target }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/shouting-toad "$name/"
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" -C "$name" .
          bash installer/package_macos.sh "target/${{ matrix.target }}/release/shouting-toad" dist
          (cd dist && zip -qry "../ShoutingToad-${{ matrix.target }}.app.zip" ShoutingToad.app)
          echo "ASSETS=$name.tar.gz ShoutingToad-${{ matrix.target }}.app.zip" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "shouting-toad-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/shouting-toad.exe $name/
          Copy-Item README.md, LICENSE, installer/install_windows.ps1, installer/uninstall_windows.ps1 $name/
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          # Setup.exe (Inno Setup): per-user install, shortcuts, uninstaller, optional PATH
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$version" "/DBinary=$PWD\target\${{ matrix.target }}\release\shouting-toad.exe" installer\ShoutingToad.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item dist\ShoutingToad-Setup-x64.exe .
          # The installer must install and uninstall cleanly
          Start-Process .\ShoutingToad-Setup-x64.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$PWD\st-test" -Wait
          if (-not (Test-Path st-test\shouting-toad.exe)) { throw "installer did not install the app" }
          Start-Process st-test\unins000.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Test-Path st-test\shouting-toad.exe) { throw "uninstaller left the app behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            *.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
