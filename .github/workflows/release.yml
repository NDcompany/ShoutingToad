name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name=shouting-toad-${{ matrix.target }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/shouting-toad "$name/"
          cp README.md LICENSE installer/install_linux.sh installer/uninstall_linux.sh installer/shouting-toad.desktop assets/icon_256.png "$name/"
          # Flat archive: extracting it puts ./shouting-toad in the current folder
          # (the generated CI workflow relies on this).
          tar -czf "$name.tar.gz" -C "$name" .
          echo "ASSETS=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          name=shouting-toad-${{ matrix.target }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/shouting-toad "$name/"
          cp README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" -C "$name" .
          bash installer/package_macos.sh "target/${{ matrix.target }}/release/shouting-toad" dist
          (cd dist && zip -qry "../ShoutingToad-${{ matrix.target }}.app.zip" ShoutingToad.app)
          echo "ASSETS=$name.tar.gz ShoutingToad-${{ matrix.target }}.app.zip" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "shouting-toad-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/shouting-toad.exe $name/
          Copy-Item README.md, LICENSE, installer/install_windows.ps1, installer/uninstall_windows.ps1 $name/
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          "ASSETS=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
